<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت موجودی | ZHNERAL</title><style>*{box-sizing:border-box}body{margin:0;background:#030303;color:#fff;font:16px/1.9 Tahoma,Arial;padding:18px}main{max-width:850px;margin:auto}.panel{background:#100b0d;border:1px solid #5c1825;border-radius:16px;padding:18px;margin:14px 0}h1,h2{color:#ff5268}input,textarea{width:100%;background:#080708;color:#fff;border:1px solid #51202a;border-radius:9px;padding:11px;margin:5px 0;font:inherit}button{background:linear-gradient(135deg,#b40e2a,#570818);color:#fff;border:1px solid #ff304c;border-radius:9px;padding:10px 15px;font:inherit;cursor:pointer;margin:5px 0}button.secondary{background:#171114;border-color:#5c3038}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.item{border:1px solid #51202a;border-radius:12px;padding:12px;margin:10px 0}.muted{color:#d6bfc4}.notice{background:#211a0b;color:#ffe6a3;padding:12px;border-radius:10px}.hidden{display:none}</style></head><body><main><h1>👑 مدیریت موجودی ژنرال</h1><p class="muted">این صفحه فقط برای مدیر است. آدرس ایمیل مجاز در Policy پایگاه داده محدود شده است.</p><div class="notice">قبل از استفاده، URL و anon key پروژه Supabase را در این فایل وارد کنید. کلید service_role را هرگز در سایت قرار ندهید.</div><section id="login" class="panel"><h2>ورود مدیر</h2><label>ایمیل مدیر</label><input id="email" type="email" autocomplete="username" value="ZHNERAL.ir@gmail.com"><label>رمز عبور Supabase</label><input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور را اینجا وارد کنید"><button id="loginBtn">ورود</button><p id="loginMsg" class="muted"></p></section><section id="app" class="hidden"><div class="panel"><h2>ثبت محصول جدید</h2><form id="productForm"><div class="grid"><input id="name" placeholder="نام محصول" required maxlength="120"><input id="price" placeholder="قیمت (اختیاری)" maxlength="100"><input id="stock" type="number" min="0" step="1" value="0" placeholder="تعداد موجودی" required><input id="image" type="url" placeholder="لینک تصویر (اختیاری)"></div><textarea id="description" placeholder="توضیحات (اختیاری)" maxlength="1000"></textarea><button type="submit">＋ افزودن محصول</button></form></div><div class="panel"><h2>محصولات ثبت‌شده</h2><p id="listMsg" class="muted"></p><div id="products"></div><button class="secondary" id="logoutBtn">خروج از حساب</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// تنظیمات عمومی پروژه؛ anon key با RLS امن است، service_role ممنوع.
const SUPABASE_URL='https://vkzvgnsycnvipqqqgndl.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_FL34fvGV-4YxbrKGM2l_gA_hDC7SRFK';const ADMIN_EMAIL='ZHNERAL.ir@gmail.com';
const $=id=>document.getElementById(id);let db=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t){$('loginMsg').textContent=t}function requireConfig(){if(!window.supabase||SUPABASE_URL.startsWith('YOUR_')||SUPABASE_ANON_KEY.startsWith('YOUR_')){msg('ابتدا URL و anon key را در فایل admin.html تنظیم کنید.');return false}return true}
async function checkSession(){if(!db)return;const {data:{session}}=await db.auth.getSession();if(session){const email=session.user.email||'';if(email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()||!session.user.email_confirmed_at){await db.auth.signOut();msg('این حساب ایمیل مجاز و تأییدشده مدیر نیست.');return} $('login').classList.add('hidden');$('app').classList.remove('hidden');await loadProducts()}}
$('loginBtn').onclick=async()=>{if(!requireConfig())return;db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const email=$('email').value.trim();if(email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){msg('فقط ایمیل مدیر مجاز است.');return}msg('در حال ورود…');const {data,error}=await db.auth.signInWithPassword({email,password:$('password').value});if(error){msg('ورود ناموفق: '+error.message);return}if(!data.user.email_confirmed_at||data.user.email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await db.auth.signOut();msg('ایمیل باید تأیید شده و متعلق به مدیر باشد.');return}await checkSession()};
async function loadProducts(){const box=$('products');$('listMsg').textContent='در حال بارگذاری…';const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(error){$('listMsg').textContent='خطا: '+error.message;return} $('listMsg').textContent=data.length+' محصول';box.innerHTML=data.map(p=>`<article class="item"><strong>${esc(p.name)}</strong><p>${esc(p.description||'')}</p><p>قیمت: ${esc(p.price||'—')} | موجودی: ${Number(p.stock)}</p><div class="grid"><input id="stock-${p.id}" type="number" min="0" step="1" value="${Number(p.stock)}" aria-label="موجودی جدید"><input id="price-${p.id}" value="${esc(p.price||'')}" placeholder="قیمت"></div><label><input id="active-${p.id}" type="checkbox" ${p.active?'checked':''} style="width:auto"> نمایش در سایت</label><br><button onclick="saveProduct('${p.id}')">ذخیره تغییرات</button> <button class="secondary" onclick="deleteProduct('${p.id}')">حذف محصول</button></article>`).join('')||'<p>محصولی ثبت نشده است.</p>'}
window.saveProduct=async id=>{const stock=Number($('stock-'+id).value);if(!Number.isInteger(stock)||stock<0){alert('موجودی باید عدد صحیح صفر یا بیشتر باشد.');return}const {error}=await db.from('products').update({stock,price:$('price-'+id).value.trim()||null,active:$('active-'+id).checked,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert('ذخیره نشد: '+error.message);else{alert('تغییرات ذخیره شد.');await loadProducts()}};
window.deleteProduct=async id=>{if(!confirm('این محصول حذف شود؟'))return;const {error}=await db.from('products').delete().eq('id',id);if(error)alert('حذف نشد: '+error.message);else await loadProducts()};
$('productForm').onsubmit=async e=>{e.preventDefault();const stock=Number($('stock').value);if(!Number.isInteger(stock)||stock<0){alert('موجودی باید عدد صحیح صفر یا بیشتر باشد.');return}const {error}=await db.from('products').insert({name:$('name').value.trim(),price:$('price').value.trim()||null,stock,image_url:$('image').value.trim()||null,description:$('description').value.trim()||null,active:true});if(error){alert('ثبت نشد: '+error.message);return}e.target.reset();$('stock').value='0';await loadProducts()};
$('logoutBtn').onclick=async()=>{if(db)await db.auth.signOut();$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value='';msg('از حساب خارج شدید.')};if(requireConfig()){db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);checkSession()}
</script></body></html>
