<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>ZHNERAL | چت خصوصی</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Tahoma,Arial,sans-serif}
header{padding:20px;text-align:center;background:#111;border-bottom:1px solid #c5a044}
.logo{font-size:27px;font-weight:bold;color:#e8c15d}
header p{color:#aaa;font-size:12px}
a{color:#e8c15d}
main{max-width:800px;margin:20px auto;padding:12px}
.card{background:#121212;border:1px solid #303030;border-radius:14px;padding:17px;margin-bottom:15px}
h2{font-size:18px;color:#e8c15d;margin-top:0}
input,button{font-family:inherit;font-size:14px;width:100%;padding:13px;margin:6px 0;border-radius:9px}
input{background:#090909;color:white;border:1px solid #444}
button{background:#d9b34c;color:#111;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#242424;color:white;border:1px solid #444}
button:disabled{opacity:.5}
.hidden{display:none!important}
.status{background:#202020;padding:12px;border-radius:9px;margin-bottom:15px;font-size:13px;line-height:1.8;overflow-wrap:anywhere}
.muted{font-size:12px;color:#aaa;line-height:1.9}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#202020;padding:12px;border-radius:9px;margin-top:8px}
.row button{width:auto;min-width:85px}
#messages{height:340px;overflow-y:auto;background:#090909;border:1px solid #333;border-radius:10px;padding:10px;margin:12px 0}
.message{padding:10px 12px;background:#292929;border-radius:12px;max-width:85%;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.message.mine{background:#70551d;margin-right:auto}
.message small{display:block;font-size:10px;color:#ddd;margin-top:5px}
#sendForm{display:flex;gap:7px}
#sendForm input{flex:1;min-width:0}
#sendForm button{width:80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top button{width:auto}
footer{text-align:center;padding:20px;color:#777;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="logo">ZHNERAL</div>
  <p>پیام‌رسان خصوصی کاربران</p>
  <a href="index.html">بازگشت به سایت</a>
</header>
<main>
  <div id="status" class="status">در حال اتصال به فایربیس...</div>
  <section id="auth" class="card hidden">
    <h2>ورود یا ثبت‌نام</h2>
    <input id="email" type="email" placeholder="ایمیل" autocomplete="email">
    <input id="password" type="password" placeholder="رمز عبور (حداقل ۶ نویسه)" autocomplete="current-password">
    <button id="login">ورود به حساب</button>
    <button id="register" class="secondary">ساخت حساب جدید</button>
  </section>
  <section id="chooseName" class="card hidden">
    <h2>انتخاب نام کاربری</h2>
    <p class="muted">۳ تا ۲۰ نویسه؛ حروف انگلیسی، عدد و زیرخط.</p>
    <input id="username" maxlength="20" placeholder="مثلاً ZHNERAL_123">
    <button id="saveName">ثبت نام کاربری</button>
  </section>
  <section id="app" class="hidden">
    <div class="card">
      <div class="top">
        <div><h2>حساب من</h2><div id="myName"></div></div>
        <button id="logout" class="secondary">خروج</button>
      </div>
    </div>
    <div class="card">
      <h2>جست‌وجوی کاربران</h2>
      <input id="searchName" maxlength="20" placeholder="نام کاربری دقیق">
      <button id="search">جست‌وجو</button>
      <div id="searchResults"></div>
    </div>
    <div class="card">
      <h2>گفت‌وگوهای من</h2>
      <div id="chatList" class="muted">در حال بارگذاری...</div>
    </div>
    <div id="conversation" class="card hidden">
      <div class="top"><h2 id="chatTitle">گفت‌وگو</h2><button id="closeChat" class="secondary">بستن</button></div>
      <div id="messages"></div>
      <form id="sendForm">
        <input id="messageText" maxlength="2000" placeholder="پیامت را بنوی..." autocomplete="off">
        <button id="send" type="submit">ارسال</button>
      </form>
    </div>
  </section>
</main>
<footer>ZHNERAL ©</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAf_q29RAQTaWzA0XMRhhNX69yH9meSh6I",
  authDomain: "zhneral-f0da6.firebaseapp.com",
  projectId: "zhneral-f0da6",
  storageBucket: "zhneral-f0da6.firebasestorage.app",
  messagingSenderId: "817470560595",
  appId: "1:817470560595:web:d2a0b26ff7d62ed86169a6",
  measurementId: "G-85MKKWY30X"
};

const $ = id => document.getElementById(id);
let auth, db, me=null, profile=null, activeChat=null;
let stopMessages=null, stopChats=null, busy=false;

function status(msg,error=false){
  $("status").textContent=msg;
  $("status").style.color=error?"#ff8585":"#e8c15d";
}
function show(id,yes){$(id).classList.toggle("hidden",!yes)}
function usernameKey(v){return v.trim().replace(/^@/,"").toLowerCase()}
function validName(v){return /^[a-zA-Z0-9_]{3,20}$/.test(v)}

function report(error){
  console.error("ZHNERAL FIREBASE ERROR:",error.code,error.message,error);
  let detail=error.code ? error.code+" — "+error.message : error.message;
  status("خطا: "+(detail||"خطای ناشناخته"),true);
}

async function register(){
  const email=$("email").value.trim(), password=$("password").value;
  if(!email||password.length<6){status("ایمیل معتبر و رمز عبور حداقل ۶ نویسه‌ای وارد کن.",true);return}
  try{status("در حال ثبت‌نام...");await auth.createUserWithEmailAndPassword(email,password)}
  catch(e){report(e)}
}
async function login(){
  const email=$("email").value.trim(),password=$("password").value;
  if(!email||!password){status("ایمیل و رمز عبور را وارد کن.",true);return}
  try{status("در حال ورود...");await auth.signInWithEmailAndPassword(email,password)}
  catch(e){report(e)}
}

async function saveName(){
  if(!me)return;
  const displayName=$("username").value.trim().replace(/^@/,"");
  const key=usernameKey(displayName);
  if(!validName(key)){status("نام کاربری باید ۳ تا ۲۰ نویسه و شامل حروف انگلیسی، عدد یا _ باشد.",true);return}
  const userRef=db.collection("users").doc(me.uid);
  const nameRef=db.collection("usernames").doc(key);
  try{
    status("در حال ثبت نام کاربری...");
    await db.runTransaction(async tx=>{
      const oldProfile=await tx.get(userRef);
      const claimedName=await tx.get(nameRef);
      if(claimedName.exists&&claimedName.data().uid!==me.uid)
        throw new Error("این نام کاربری قبلاً انتخاب شده است.");
      if(oldProfile.exists&&oldProfile.data().usernameLower&&oldProfile.data().usernameLower!==key)
        throw new Error("فعلاً تغییر نام کاربری پشتیبانی نمی‌شود.");
      if(!claimedName.exists)tx.set(nameRef,{uid:me.uid});
      tx.set(userRef,{
        username:displayName,
        usernameLower:key,
        createdAt:oldProfile.exists&&oldProfile.data().createdAt
          ?oldProfile.data().createdAt
          :firebase.firestore.FieldValue.serverTimestamp()
      },{merge:true});
    });
  }catch(e){report(e)}
}

async function searchUser(){
  if(!me)return;
  const key=usernameKey($("searchName").value),box=$("searchResults");
  box.textContent="";
  if(!validName(key)){box.textContent="یک نام کاربری معتبر وارد کن.";return}
  try{
    const claim=await db.collection("usernames").doc(key).get();
    if(!claim.exists){box.textContent="کاربری پیدا نشد.";return}
    const uid=claim.data().uid;
    if(uid===me.uid){box.textContent="این نام کاربری متعلق به خودت است.";return}
    const userDoc=await db.collection("users").doc(uid).get();
    if(!userDoc.exists){box.textContent="پروفایل کاربر موجود نیست.";return}
    const user=userDoc.data(),row=document.createElement("div");
    row.className="row";
    const label=document.createElement("span");
    label.textContent="@"+user.username;
    const button=document.createElement("button");
    button.textContent="پیام دادن";
    button.onclick=()=>openChat(uid,user.username);
    row.append(label,button);box.appendChild(row);
  }catch(e){report(e)}
}

function chatIdFor(a,b){return [a,b].sort().join("_")}

async function openChat(otherUid,otherName){
  if(!me||busy)return;
  busy=true;
  try{
    const id=chatIdFor(me.uid,otherUid);
    const ref=db.collection("chats").doc(id);
    const snap=await ref.get();
    if(!snap.exists){
      await ref.set({
        members:[me.uid,otherUid].sort(),
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
        lastMessage:"",
        lastMessageAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    }else if(!(snap.data().members||[]).includes(me.uid)||
             !(snap.data().members||[]).includes(otherUid)){
      throw new Error("اعضای گفت‌وگو معتبر نیستند.");
    }
    activeChat=id;
    $("chatTitle").textContent="گفت‌وگو با @"+otherName;
    $("messages").textContent="";
    show("conversation",true);
    listenMessages(id);
    await loadChats();
    $("conversation").scrollIntoView({behavior:"smooth",block:"start"});
    status("گفت‌وگو باز شد.");
  }catch(e){report(e)}
  finally{busy=false}
}

function listenMessages(id){
  if(stopMessages)stopMessages();
  stopMessages=db.collection("chats").doc(id).collection("messages")
    .orderBy("createdAt","asc").limit(100)
    .onSnapshot(snapshot=>{
      const box=$("messages");box.textContent="";
      snapshot.forEach(doc=>{
        const data=doc.data(),bubble=document.createElement("div");
        bubble.className="message"+(data.senderId===me.uid?" mine":"");
        const text=document.createElement("div");text.textContent=data.text||"";
        const time=document.createElement("small");
        time.textContent=data.createdAt&&data.createdAt.toDate
          ?data.createdAt.toDate().toLocaleString("fa-IR"):"اکنون";
        bubble.append(text,time);box.appendChild(bubble);
      });
      box.scrollTop=box.scrollHeight;
    },report);
}

async function sendMessage(event){
  event.preventDefault();
  if(!me||!activeChat)return;
  const text=$("messageText").value.trim();
  if(!text)return;
  $("send").disabled=true;
  try{
    const chatRef=db.collection("chats").doc(activeChat);
    const chat=await chatRef.get();
    if(!chat.exists||!(chat.data().members||[]).includes(me.uid))
      throw new Error("این گفت‌وگو در دسترس نیست.");
    await chatRef.collection("messages").add({
      senderId:me.uid,
      text,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    await chatRef.update({
      lastMessage:text.slice(0,100),
      lastMessageAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    $("messageText").value="";
    status("پیام ارسال شد.");
  }catch(e){report(e)}
  finally{$("send").disabled=false}
}

async function loadChats(){
  if(!me)return;
  const box=$("chatList");
  try{
    const result=await db.collection("chats")
      .where("members","array-contains",me.uid).get();
    box.textContent="";
    if(result.empty){box.textContent="هنوز گفت‌وگویی نداری. از جست‌وجوی کاربران شروع کن.";return}
    const chats=result.docs.map(doc=>({id:doc.id,...doc.data()}));
    chats.sort((a,b)=>(b.lastMessageAt?.toMillis?.()||0)-(a.lastMessageAt?.toMillis?.()||0));
    for(const chat of chats){
      const otherUid=(chat.members||[]).find(uid=>uid!==me.uid);
      if(!otherUid)continue;
      const row=document.createElement("div");row.className="row";
      const info=document.createElement("div");
      const name=document.createElement("strong");name.textContent="@کاربر";
      const preview=document.createElement("div");preview.className="muted";
      preview.textContent=chat.lastMessage||"هنوز پیامی ارسال نشده است";
      info.append(name,preview);
      const button=document.createElement("button");button.textContent="باز کردن";
      button.onclick=async()=>{
        try{
          const u=await db.collection("users").doc(otherUid).get();
          openChat(otherUid,u.exists?u.data().username:"کاربر");
        }catch(e){report(e)}
      };
      row.append(info,button);box.appendChild(row);
      try{
        const u=await db.collection("users").doc(otherUid).get();
        if(u.exists)name.textContent="@"+u.data().username;
      }catch(e){console.error(e)}
    }
  }catch(e){report(e)}
}

function stopListeners(){
  if(stopMessages)stopMessages();
  if(stopChats)stopChats();
  stopMessages=null;stopChats=null;activeChat=null;
}
function showAccount(user,userProfile){
  me=user;profile=userProfile;
  show("auth",!user);
  show("chooseName",!!user&&!userProfile);
  show("app",!!user&&!!userProfile);
  if(!user){
    stopListeners();status("برای استفاده از چت وارد حساب شو.");return;
  }
  if(!userProfile){status("یک نام کاربری انتخاب کن.");return}
  $("myName").textContent="@"+userProfile.username;
  status("وارد حساب شدی.");
  loadChats();
  if(stopChats)stopChats();
  stopChats=db.collection("chats")
    .where("members","array-contains",user.uid)
    .onSnapshot(()=>loadChats(),report);
}

$("register").onclick=register;
$("login").onclick=login;
$("saveName").onclick=saveName;
$("search").onclick=searchUser;
$("searchName").addEventListener("keydown",e=>{if(e.key==="Enter")searchUser()});
$("sendForm").addEventListener("submit",sendMessage);
$("logout").onclick=async()=>{
  stopListeners();show("conversation",false);
  try{await auth.signOut()}catch(e){report(e)}
};
$("closeChat").onclick=()=>{
  if(stopMessages)stopMessages();
  stopMessages=null;activeChat=null;show("conversation",false);
};

try{
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();db=firebase.firestore();
  auth.onAuthStateChanged(async user=>{
    if(!user){showAccount(null,null);return}
    try{
      const snap=await db.collection("users").doc(user.uid).get();
      showAccount(user,snap.exists?snap.data():null);
    }catch(e){report(e);showAccount(user,null)}
  });
}catch(e){report(e)}
</script>
</body>
</html>
